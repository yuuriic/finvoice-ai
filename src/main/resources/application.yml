spring:
  application:
    name: voice-budget-ai

  datasource:
    url: jdbc:h2:file:./data/voicebudget;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

  ai:
    # Groq expoe uma API compativel com a da OpenAI, entao reaproveitamos o
    # mesmo starter/cliente (spring-ai-starter-model-openai) apontando o
    # base-url para a Groq.
    openai:
      api-key: ${GROQ_API_KEY:}
      base-url: https://api.groq.com/openai
      chat:
        options:
          model: llama-3.3-70b-versatile
          temperature: 0.3
      audio:
        transcription:
          options:
            model: whisper-large-v3-turbo
        speech:
          options:
            model: canopylabs/orpheus-v1-english
            voice: hannah
            response-format: mp3

server:
  port: 8080

logging:
  level:
    com.dio.voicebudget: INFO
